services:
  - type: web
    name: cryptomaka-backend
    env: python
    buildCommand: pip install -e .
    startCommand: uvicorn cryptomaka.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cryptomaka-db
          property: connectionString

  - type: web
    name: cryptomaka-frontend
    env: node
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: npx --prefix frontend serve -s dist -p $PORT
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cryptomaka-backend.onrender.com/api/v1

databases:
  - name: cryptomaka-db
    databaseName: cryptomaka
    user: cryptomaka

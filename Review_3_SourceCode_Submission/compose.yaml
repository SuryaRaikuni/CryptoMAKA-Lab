version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./data/cryptomaka_prod.db
      - CORS_ORIGINS=http://localhost:8080
    restart: unless-stopped

volumes:
  sqlite_data:

name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Bandit Security Check
        run: |
          bandit -r backend/cryptomaka

      - name: Run Pytest
        run: |
          pytest tests/ -v

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript compiler check
        working-directory: ./frontend
        run: npm run build

  docs:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      # Install markdownlint-cli via npm
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      # Lint all markdown docs
      - name: Run Markdown Linter
        run: markdownlint "docs/**/*.md" --ignore node_modules

      # Set up Pandoc for PDF generation
      - name: Set up Pandoc
        uses: actions/setup-pandoc@v2
        with:
          version: '3.1'

      # Install LaTeX (texlive) for PDF generation
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra
      # Generate PDF from academic write‑up
      - name: Generate PDF Report
        run: |
          mkdir -p research/figures
          pandoc docs/academic-writeup.md -V geometry:margin=1in -o research/figures/academic-report.pdf

      # Upload PDF as artifact
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: academic-report-pdf
          path: research/figures/academic-report.pdf
